apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ds-aurora-secret
  namespace: dolphinscheduler
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ds-aurora-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: ""    # /ds-aws/aurora/password — replaced by install.sh
        property: username
    - secretKey: password
      remoteRef:
        key: ""    # /ds-aws/aurora/password — replaced by install.sh
        property: password

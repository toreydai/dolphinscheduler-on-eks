apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ds-api-token-secret
  namespace: dolphinscheduler
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ds-api-token-secret
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: ""   # /ds-aws/ds-api-token — replaced by install.sh
        property: token

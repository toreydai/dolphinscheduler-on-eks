# Keeps the chart's own `{fullname}-externaldb` Secret's database-password
# key in sync with Secrets Manager, without that value ever passing through
# `helm --set` (which bakes it into the Helm release history in plaintext —
# verified live: `kubectl get secret sh.helm.release.v1.dolphinscheduler.*`
# holds every value a release was ever installed/upgraded with, including
# `externalDatabase.password`, forever, for anyone who can read that Secret).
#
# creationPolicy: Merge requires the target Secret to already exist — verified
# live, ESO reports "secret will not be created due to CreationPolicy=Merge"
# and stays NotReady otherwise. The chart's own secret-external-database.yaml
# template creates `{fullname}-externaldb` from `externalDatabase.password`
# unconditionally, so install.sh must run `helm upgrade --install` with a
# harmless placeholder for that value FIRST, then apply this ExternalSecret,
# then roll out the master/worker/api/alert pods — the password is consumed
# as an env var at container start, not hot-reloaded, so pods started against
# the placeholder need an explicit restart to pick up the real one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ds-externaldb-password-patch
  namespace: dolphinscheduler
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: dolphinscheduler-externaldb
    creationPolicy: Merge
  data:
    - secretKey: database-password
      remoteRef:
        key: ""    # /ds-aws/aurora/password — replaced by install.sh
        property: password

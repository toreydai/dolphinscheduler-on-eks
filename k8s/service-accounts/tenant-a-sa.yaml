apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-a-worker
  namespace: dolphinscheduler
  annotations:
    eks.amazonaws.com/role-arn: ""   # ds-aws-tenant-a-worker-role ARN — set by install.sh
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-a-config
  namespace: dolphinscheduler
data:
  EMR_APP_ID: ""          # emr-serverless application id — set by install.sh
  EMR_JOB_ROLE_ARN: ""    # emr serverless job role arn — set by install.sh
  S3_BUCKET: ""           # s3 bucket name — set by install.sh
  TENANT: "tenant-a"
